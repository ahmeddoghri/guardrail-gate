name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run benchmark
        run: python -m app.eval

  adversarial:
    # A guardrail can regress silently: it keeps returning decisions, they are
    # just wrong. This fails the build if hallucinations start getting through
    # or if the redactor starts mangling order numbers again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Measure against the hard half
        run: |
          python -m app.advbench
          python - <<'EOF'
          from app.advbench import build_report

          report = build_report()
          grounding = report["grounding"]["v2 semantic"]
          pii = report["pii"]["v2 validating"]

          assert grounding["all"]["missed_hallucinations"] == 0, grounding["all"]
          assert grounding["all"]["false_alarms"] == 0, grounding["all"]
          assert pii["decoy"]["false_positives"] == 0, pii["decoy"]
          assert pii["obfuscated"]["recall"] == 1.0, pii["obfuscated"]
          print("guardrail holds on the adversarial corpus")
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t guardrail-gate:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name guardrail -p 8000:8000 guardrail-gate:ci
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          curl -sf -X POST http://localhost:8000/v1/guard \
            -H "Content-Type: application/json" \
            -d '{"client_id": "ci-test", "text": "hello world"}'
          docker logs guardrail
          docker stop guardrail
